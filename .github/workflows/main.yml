name: main

on:
  push:
    branches:
      - 'master'
    tags:
      # build.gradle only derives a release version from vX.Y.Z tags; anything else would publish 0.0.0.<hash>.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - 'master'
    types: [opened, synchronize]
  pull_request_target:
    branches:
      - 'master'
    types: [labeled]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # pull_request_target runs PR code with a token for the base repository, so keep it read-only.
    permissions:
      contents: read
    # No ${{ }} here: wrapped in a block scalar it becomes a non-empty string, which is always true.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test')) ||
      startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target checks out the base branch by default; test the PR head instead.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'
      - name: lint
        run: ./gradlew spotlessCheck
      - name: Test
        run: ./gradlew test --stacktrace --info
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      # push-gem-to-gpr-action runs ./gradlew itself; Gradle 6.9 cannot run on the runner's default JDK.
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'
      - name: Set up Ruby 2.7
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
      - name: push gem
        uses: trocco-io/push-gem-to-gpr-action@v1
        with:
          language: java
          gem-path: "./build/gems/*.gem"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
